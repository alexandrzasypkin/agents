# ~/.agents/mcp-configs.yaml — PORTABLE RECIPE, not frozen machine state.
#
# Env-specifics (absolute paths, ports, whether a server is running) are NOT hardcoded here.
# Bootstrap resolves them by inventorying the environment (command -v, running server, ...),
# writes the resolved config into the project (./.mcp.json / ./.codex/config.toml /
# ./opencode.json) and records it in ./.agents/REGISTRY.md. Baseline = intent; agent resolves
# the concrete value — same principle as the cross-cutting CLI tools.
#
# A config may be PER-AGENT: the same logical MCP can use a different transport per agent.

playwright:
  # Browser automation MCP (research L3 / web / qa). Transport differs per agent.
  # Logical server = @playwright/mcp (Node 18+). Canonical launcher is `npx @playwright/mcp@latest`;
  # the bare `playwright-mcp` binary exists only after `npm i -g @playwright/mcp`. The stdio command
  # below is the POSIX-resolved value (works as-is on Linux/macOS/WSL2/Git-Bash). On NATIVE Windows
  # bootstrap MUST wrap it `cmd /c npx -y @playwright/mcp@latest --browser chrome` — see the canon's
  # "npx/node stdio MCP on native Windows" bootstrap rule (Node spawn can't resolve npx.cmd → ENOENT).
  # `--browser chrome` is a Windows-only arg (registry-resolves Chrome, dodges the path bug); do NOT
  # add it on POSIX, where Chrome may be absent and only chromium is installed.
  claude:   { type: stdio,  command: playwright-mcp }          # POSIX default; native Windows → cmd /c npx wrapper (see canon)
  codex:    { type: remote, url: "<resolve at bootstrap>" }    # local playwright server; resolve port (convention :8931 shared / :8932 headed); 9222 = Chrome CDP, a separate layer
  opencode: { type: stdio,  command: playwright-mcp }          # POSIX default; native Windows → cmd /c npx wrapper (see canon)

# NOT in the baseline — project-level self-config (record in REGISTRY when attached):
# - cloudflare: claude.ai-managed integration for Claude (account-level, no local command);
#               codex/opencode need their own Cloudflare MCP (remote) set up per project.
# - gsc (Google Search Console): not configured anywhere; connect when a project needs it
#               (auth: OAuth or service account).
# - codegraph / gortex: structural code-index MCP; set up per project on measured grep-scan
#               pain (see the code-search rule). Index is a regenerable, gitignored cache.
