# ~/.agents/mcp-configs.yaml — MCP recipes by name, split into GLOBAL infra vs PROJECT-BOUND.
#
# PORTABLE RECIPE, not frozen machine state. Env-specifics (absolute paths, ports, whether a
# server is running) are NOT hardcoded — resolved by inventorying the environment.
#
# TWO CLASSES (the same global/local criterion as hooks & permissions — is it tied to THIS
# project's account/resource/repo?):
#  • GLOBAL infra — shared, tied to no project. Installed ONCE per machine (Setup step, like
#    baseline-guard) into each agent's GLOBAL config. Bootstrap does NOT render it into project
#    configs; a project that needs it simply USES the global server. Do NOT duplicate it into
#    ./.mcp.json / ./.codex/config.toml / ./opencode.json.
#  • PROJECT-BOUND — tied to a project's account/resource/repo. Rendered per-project into the
#    project's native MCP config and recorded in ./.agents/REGISTRY.md.

# ── GLOBAL infra (installed once per machine; NOT rendered per-project) ────────
playwright:
  scope: global               # shared browser — do NOT write into ./.mcp.json / ./.codex/config.toml
  transport: local-server     # ONE persistent local server; ALL agents connect by localhost URL (not stdio spawn)
  # Logical server = @playwright/mcp (Node 18+). A single persistent server per machine, warm &
  # shared (shared browser context → reused auth/cookies, no cold start) is cheaper than a
  # per-session stdio spawn. Every agent connects to the SAME server:
  #   Claude   — ~/.claude/settings.json mcpServers: { "type":"http", "url":"http://localhost:8931/mcp" }
  #   codex    — ~/.codex/config.toml [mcp_servers.playwright-shared] url="http://localhost:8931/mcp"
  #              (+ playwright-headed :8932 for a headed/auth profile)
  #   opencode — ~/.config/opencode global config, same http url.
  # Endpoint is streamable-HTTP /mcp (NOT legacy /sse). 9222 = Chrome CDP, a separate layer.
  # LADDER (both Claude & codex):
  #   (a) connect to http://localhost:8931/mcp — health-check the MCP `initialize`, not just an open port;
  #   (b) if down — ENSURE-SERVER: install the binary if missing (`npm i -g @playwright/mcp`), then
  #       start `playwright-mcp --port 8931 --headless --shared-browser-context` (Windows: Git Bash / cmd /c npx);
  #   (c) if it still can't come up (install fails / offline / no perm) — FALL BACK to a per-session
  #       stdio spawn: Claude `{ "command": "npx", "args": ["-y","@playwright/mcp@latest"] }` (or the
  #       `playwright-mcp` binary); native Windows `cmd /c npx …`. Self-contained, costlier, always works.
  #   Best run the server as a machine service/autostart so it stays warm. Never silently give up.
  # WINDOWS lifecycle [!]: a server started FROM an agent tool-job DIES with that job — the temp job
  #   closes, Chrome + MCP are killed, and a temp profile loses its cookies/session mid-login. So the
  #   shared server must be owned by autostart / a service / a user terminal (Explorer-owned `cmd /k`),
  #   NEVER a child of an agent tool call. Headed auth: use a PERSISTENT profile
  #   `%LOCALAPPDATA%\Playwright-MCP\headed-profile` — log in via a detached Chrome (Explorer shortcut),
  #   fully close it, THEN start headed MCP via Explorer-owned `cmd /k … --user-data-dir <that profile>`.
  #   codex: if it started while the ports were down, reconnect/restart it once the servers are back.

codex-agent:
  scope: global               # the codex binary is machine-level; a delegation tool tied to no project
  transport: stdio-spawn      # `codex mcp-server` — spawned per call (a fresh codex thread), NOT a persistent server
  # Claude/opencode (the LEAD) add codex as an MCP server and DELEGATE a coding subtask to it — structured
  # JSON-RPC, not tmux screen-scraping (which races on timing, prompt-detection and ANSI noise). This is
  # the reverse of the usual "each agent configures itself": here the lead adds codex as a TOOL. codex
  # `mcp-server` exposes two tools:
  #   codex        — run a task, returns the result + a `threadId`;
  #   codex-reply  — pass that threadId to continue the SAME codex thread (context persists in-session).
  # Claude client config (GLOBAL/user scope, so delegation works in any project — stdio means it only
  # runs on a call). Add it with the CLI, which writes the right file:
  #   claude mcp add codex-agent -s user -- codex mcp-server   (native Windows: -- cmd /c codex mcp-server)
  # [!] `claude mcp add -s user` writes ~/.claude.json, NOT ~/.claude/settings.json — same user scope,
  #   different file. Hand-editing ~/.claude/settings.json `mcpServers: {"codex-agent":{"command":"codex",
  #   "args":["mcp-server"]}}` also works, but the CLI is the supported path; do NOT do both for one name
  #   (two files, one wins — confusing). Added once at Setup (like playwright / baseline-guard), not
  #   rendered per-project.
  # WHEN: a second opinion / an independent implementation, or context-heavy work kept off the lead's
  #   context. NOT for trivial lookups — each call is a FULL codex agent (its own auth/model, tokens, latency).
  # SAME-TREE [!]: codex operates on the current working tree. Read/analysis is clean; for concurrent
  #   EDITS isolate it in a git worktree (same rule as parallel workflow agents), or the two race on files.
  # ONE-SHOT alternative (no MCP): `codex exec "<prompt>"` — headless CLI → stdout, zero config; use when
  #   you don't need a persistent thread. Reserve tmux for when a HUMAN must watch a live codex TUI.

claude-agent:
  scope: global               # the claude binary is machine-level; exposes Claude's tools to an MCP client
  transport: stdio-spawn      # `claude mcp serve` — stdio MCP server, spawned per call
  # The REVERSE of codex-agent: codex/opencode (the LEAD) add Claude as an MCP server to drive it. Note
  # the ASYMMETRY with codex-agent —
  #   codex mcp-server → a DELEGATION interface (task in → result + threadId; codex self-manages inside);
  #   claude mcp serve → exposes Claude's RAW TOOLSET (read/write/edit/bash), not a "run a task" tool.
  # codex client config (~/.codex/config.toml):
  #   [mcp_servers.claude-code]
  #   command = "claude"        # or the full path from `which claude` if not on PATH
  #   args = ["mcp", "serve"]
  #   (native Windows: command = "cmd", args = ["/c","claude","mcp","serve"])
  # [!] NO PERMISSION GATING: as an MCP server Claude does NOT prompt for tool approval — the CONNECTING
  #   client is responsible for confirming each call. So codex driving claude-code can make it write files
  #   / run bash WITHOUT Claude's usual prompts. Only wire this where the client gates tool calls, or in a
  #   sandbox / worktree you accept it operating in unattended. Same-tree + cost cautions as codex-agent.
  # Direction: use this for codex-as-lead → Claude. For the common Claude-as-lead → codex case use
  #   codex-agent instead — a cleaner task interface with its own internal gating.

# ── PROJECT-BOUND (rendered per-project on demand; record in REGISTRY) ─────────
# - cloudflare: claude.ai-managed integration for Claude (account-level, no local command);
#               codex/opencode need their own Cloudflare MCP (remote) set up per project.
# - gsc (Google Search Console): not configured anywhere; connect when a project needs it
#               (auth: OAuth or service account).
# - codegraph / gortex: structural code-index MCP; set up per project on measured grep-scan
#               pain (see the code-search rule). Index is a regenerable, gitignored cache.
