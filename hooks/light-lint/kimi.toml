# Merge into the GLOBAL ~/.kimi-code/config.toml (kimi has NO project-level hooks — measured/doc'd).
# Project-scoped DISPATCHER: kimi runs hooks with cwd = the project dir (measured), so this runs the
# project's own copy if it bootstrapped this hook and is a silent no-op (exit 0) elsewhere — keeps the
# per-project semantics of the canon. Payload (measured, kimi 2.6.2): tool_name Bash|Write|Edit,
# tool_input.command / tool_input.path (+content | old_string,new_string).
# Non-blocking nudge (stderr); parses tool_input.path. Whether kimi surfaces PostToolUse stderr to the model is NOT verified.
[[hooks]]
event = "PostToolUse"
command = 'f=".agents/hooks/light-lint/lint.sh"; [ -f "$f" ] && exec bash "$f"; exit 0'
timeout = 10
